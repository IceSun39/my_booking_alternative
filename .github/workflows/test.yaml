name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: new_test_user
          POSTGRES_PASSWORD: secure_password
          POSTGRES_DB: booking_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U new_test_user -d booking_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "postgresql+asyncpg://new_test_user:secure_password@localhost:5432/booking_test_db"
      REDIS_URL: "redis://localhost:6379/0"
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/0"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      ALGORITHM: "HS256"

    steps:
      - name: Setup project
        uses: ./.github/actions/setup-project.yaml

      - name: Run tests
        uses: ./.github/actions/run-tests.yaml