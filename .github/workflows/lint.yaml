name: Lint
on:
  workflow_call:

permissions:
  contents: read

jobs:
  linter:
    name: Run Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Ruff check
        shell: bash
        run: uv run ruff check .

      - name: Ruff format check
        shell: bash
        run: uv run ruff format --check .
