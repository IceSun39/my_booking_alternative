name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: new_test_user
          POSTGRES_PASSWORD: secure_password
          POSTGRES_DB: booking_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U new_test_user -d booking_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "postgresql+asyncpg://new_test_user:secure_password@localhost:5432/booking_test_db"
      REDIS_URL: "redis://localhost:6379/0"
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/0"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      ALGORITHM: "HS256"

    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin https://github.com/${GITHUB_REPOSITORY}.git
    
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
    
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            fetch --no-tags --depth=1 origin "$GITHUB_REF"
    
          git checkout --detach FETCH_HEAD

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -vgiyt
